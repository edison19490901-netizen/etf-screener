<!DOCTYPE html><html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e27">
<link rel="icon" type="image/png" href="/ETF_icon.png">
<title>ETF Screener Dashboard</title>
<style>
:root{--bg:#0a0e27;--card:#111640;--border:#1e2456;--text:#e2e8f0;--muted:#8892b0;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--accent:#6366f1}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 20% 50%,rgba(99,102,241,.06),transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(34,197,94,.04),transparent 50%);pointer-events:none;z-index:0}
.container{max-width:1600px;margin:0 auto;padding:16px 20px;position:relative;z-index:1}
.header{text-align:center;padding:32px 20px 18px;border-bottom:1px solid var(--border);margin-bottom:12px}
.header h1{font-size:1.7rem;font-weight:700;background:linear-gradient(135deg,#e2e8f0,#a5b4fc,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header .sub{color:var(--muted);font-size:.85rem;margin-top:4px}
.info-bar{display:flex;align-items:center;gap:12px;padding:6px 0;margin-bottom:8px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.info-bar .sep{color:#334155}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.btn{padding:9px 18px;border-radius:9px;border:none;font-size:.84rem;cursor:pointer;font-weight:500;transition:.2s}
.btn-update{background:var(--accent);color:#fff}.btn-update:disabled{background:#475569;cursor:not-allowed}
.btn-view{background:var(--card);color:var(--muted);border:1px solid var(--border)}.btn-view.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-refresh{color:#fff}.btn-quick{background:#16a34a}.btn-full{background:var(--accent)}
.btn-refresh:disabled{background:#475569;cursor:not-allowed}
.search-box{padding:9px 14px;border-radius:9px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text);width:180px;outline:none;font-size:.84rem}.search-box:focus{border-color:var(--accent)}
.sort-select{padding:9px 12px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);outline:none;cursor:pointer;font-size:.82rem}
.source-bar{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:.76rem;color:var(--muted);margin-bottom:8px;flex-wrap:wrap;gap:6px}
.result-count{color:var(--muted);font-size:.8rem}

/* ── Grid View ─────────────────────────────── */
.grid-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-bottom:20px}
.grid-view.active{display:grid}.grid-view{display:none}
.etf-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:.25s}
.etf-card:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.3);border-color:var(--accent)}
.etf-card.discount{border-left:3px solid var(--green)}.etf-card.premium{border-left:3px solid var(--red)}.etf-card.neutral{border-left:3px solid var(--muted)}
.card-header{padding:10px 16px 4px;display:grid;grid-template-columns:1fr 1fr;align-items:center}
.card-name{font-weight:600;font-size:.95rem}.card-code{font-size:.68rem;color:var(--muted);font-family:monospace;background:rgba(255,255,255,.04);padding:2px 8px;border-radius:5px;text-align:right;justify-self:end}
.card-body{padding:4px 16px 8px;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.card-m{display:flex;flex-direction:column;gap:1px}
.card-m:nth-child(odd){text-align:left}
.card-m:nth-child(even){text-align:right}
.cml{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.cmv{font-size:.9rem;font-weight:600;font-family:monospace}
.cmv.green{color:var(--green)}.cmv.red{color:var(--red)}.cmv.yellow{color:var(--yellow)}
.card-chart{padding:4px 16px 8px;display:flex;align-items:center;gap:6px}
.card-chart canvas{width:100%;height:80px;border-radius:4px}
.card-chart .chart-fallback{flex:1;display:flex;align-items:center;gap:7px;font-size:.7rem;color:var(--muted)}
.card-chart .bar-bg{flex:1;height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.card-chart .bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .6s}

/* ── Table View ────────────────────────────── */
.table-view{display:none;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow-x:auto;margin-bottom:20px}
.table-view.active{display:block}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{padding:10px 5px;background:rgba(255,255,255,.02);color:var(--muted);font-weight:500;font-size:.68rem;letter-spacing:.03em;border-bottom:1px solid var(--border);white-space:nowrap;text-align:center}
td{padding:7px 5px;border-bottom:1px solid rgba(255,255,255,.03);white-space:nowrap;text-align:center;font-family:monospace;font-variant-numeric:tabular-nums;font-size:.78rem}
tr:hover td{background:rgba(255,255,255,.03);cursor:pointer}
.t-name{font-weight:500;font-family:inherit;text-align:center}.t-code{font-size:.68rem;color:var(--muted);font-family:monospace;display:block;text-align:center}
.t-discount{font-weight:600}.t-discount.green{color:var(--green)}.t-discount.red{color:var(--red)}
.t-pe{font-weight:600}.t-pe.lo{color:var(--green)}.t-pe.mi{color:var(--yellow)}.t-pe.hi{color:var(--red)}
.t-pct{font-weight:600}.t-pct.lo{color:var(--green)}.t-pct.mi{color:var(--yellow)}.t-pct.hi{color:var(--red)}

.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:10px;font-size:.88rem;z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
.toast.show{opacity:1}.toast.ok{background:rgba(34,197,94,.2);color:var(--green);border:1px solid rgba(34,197,94,.3)}
.toast.err{background:rgba(239,68,68,.2);color:var(--red);border:1px solid rgba(239,68,68,.3)}

@media(max-width:768px){.container{padding:8px}.header{padding:18px 8px 12px}.header h1{font-size:1.2rem}
.grid-view{grid-template-columns:1fr}.grid-view.active{grid-template-columns:1fr}
.toolbar{flex-direction:column;align-items:stretch}th,td{padding:4px 3px;font-size:.65rem}}
</style></head>
<body>
<div class="container">

<div class="header">
<h1>ETF Screener — Real-time Tracking</h1>
<div class="sub">14 ETFs | Quick Refresh (~3s) | Full Refresh (~130s) | K-line Charts | PE Percentile</div>
</div>

<div class="info-bar">
<span id="metaTime">--</span><span class="sep">|</span><span id="metaCount">--</span><span class="sep">|</span><span id="metaSource">--</span><span class="sep">|</span><span id="metaMode">--</span>
</div>

<div class="toolbar">
<button class="btn btn-view active" onclick="V.switch('grid')">📊 Cards</button>
<button class="btn btn-view" onclick="V.switch('table')">📋 Table</button>
<button class="btn btn-refresh btn-quick" id="btnQ" onclick="U(true,'quick')">⚡ Quick Refresh</button>
<button class="btn btn-refresh btn-full" id="btnF" onclick="U(true,'full')">🔄 Full Refresh</button>
<input class="search-box" id="q" placeholder="Search..." oninput="R()">
<select class="sort-select" id="sort" onchange="R()">
<option value="discount">折价率↓</option>
<option value="discount_asc">折价率↑</option>
<option value="size">规模↓</option>
<option value="size_asc">规模↑</option>
<option value="pe">PE分位↓</option>
<option value="pe_asc">PE分位↑</option>
<option value="change">涨跌幅↓</option>
<option value="pct_low">距1Y低点↓</option>
<option value="pct_low_asc">距1Y低点↑</option>
</select>
</div>

<div class="source-bar">
<span style="font-size:.73rem;color:var(--muted)">折价=便宜买 · 溢价=贵买 | PE分位越低估值越低 | 绿色=折价/低估 红色=溢价/高估</span>
<span class="result-count" id="rc">--</span>
</div>

<div class="grid-view active" id="gv"></div>
<div class="table-view" id="tv">
<table><thead><tr>
<th>#</th><th>名称/代码</th><th>最新价</th><th>折溢价</th><th>涨跌幅</th><th>规模(亿)</th><th>费率</th><th>PE分位</th><th>距1Y低点</th><th>距BB下轨</th><th>换手率</th>
</tr></thead><tbody id="tb"></tbody></table></div>

<div id="empty" style="display:none;text-align:center;padding:60px;color:var(--muted)"><div style="font-size:3rem;margin-bottom:16px">📭</div><p>No data loaded. Click Quick Refresh or Full Refresh to load data.</p></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ════════════════════  EMBED Data (pre-populated by update.py)  ════════════════════
var EMBED=[];

// ════════════════════  Data Engine  ════════════════════
var D={
  _etfs:[], _loaded:false, _mode:'quick',

  async load(force, mode){
    D._etfs=[]; D._loaded=false;
    var m = mode || 'quick';

    // Use EMBED if available (fast first paint) — only for non-force loads
    if(!force && typeof EMBED!=='undefined' && EMBED.length>0){
      D._etfs=EMBED; D._loaded=true;
      document.getElementById('metaSource').textContent='Cached';
      document.getElementById('gv').classList.add('active');
      document.getElementById('empty').style.display='none';
      D._updateMeta();
      R();
    }

    // Try live API
    var base = D._detectApi();
    try{
      var params = force ? '?force=1' : '';
      if(m==='full') params = (params ? params+'&' : '?') + 'full=1';
      var url = base+'/api/etf_data'+params;
      var r = await fetch(url,{signal:AbortSignal.timeout(130000)});
      var j = await r.json();
      if(j.etfs && j.etfs.length>0){
        D._etfs = j.etfs;
        D._loaded = true;
        D._mode = j.mode || m;
        document.getElementById('metaSource').textContent = 'API (live)';
        document.getElementById('metaTime').textContent = 'Updated: '+(j.updated||'--');
        document.getElementById('metaMode').textContent = 'Mode: '+(D._mode==='full'?'Full':'Quick');
        document.getElementById('gv').classList.add('active');
        document.getElementById('empty').style.display='none';
        D._updateMeta();
        R();
      }
    }catch(e){console.log('API fetch:',e.message)}

    // Show empty if nothing loaded
    if(!D._loaded){
      document.getElementById('empty').style.display='block';
      document.getElementById('gv').classList.remove('active');
      document.getElementById('tv').classList.remove('active');
    }
  },

  _updateMeta(){
    document.getElementById('metaCount').textContent = D._etfs.length+' ETFs';
    document.getElementById('rc').textContent = D._etfs.length+' ETFs';
    if(!document.getElementById('metaTime').textContent || document.getElementById('metaTime').textContent==='--'){
      var t = D._etfs[0] && D._etfs[0]._cached_at;
      if(t) document.getElementById('metaTime').textContent = 'Cached: '+t;
    }
  },

  _detectApi(){
    var a = localStorage.getItem('etf_api')||'';
    if(!a && window.location.hostname && window.location.hostname!=='localhost' && window.location.hostname!=='127.0.0.1')
      a = window.location.origin;
    if(!a) a = 'http://localhost:8080';
    localStorage.setItem('etf_api',a);
    return a;
  },

  sort(arr,key){
    switch(key){
      case 'discount': arr.sort((a,b)=>a.discount_rate - b.discount_rate); break; // negative=折扣 first
      case 'discount_asc': arr.sort((a,b)=>b.discount_rate - a.discount_rate); break;
      case 'size': arr.sort((a,b)=>(b.fund_size||0)-(a.fund_size||0)); break;
      case 'size_asc': arr.sort((a,b)=>(a.fund_size||0)-(b.fund_size||0)); break;
      case 'pe': arr.sort((a,b)=>(a.pe_percentile||999)-(b.pe_percentile||999)); break;
      case 'pe_asc': arr.sort((a,b)=>(b.pe_percentile||0)-(a.pe_percentile||0)); break;
      case 'change': arr.sort((a,b)=>(b.change_pct||0)-(a.change_pct||0)); break;
      case 'pct_low': arr.sort((a,b)=>(a.pct_from_low||999)-(b.pct_from_low||999)); break;
      case 'pct_low_asc': arr.sort((a,b)=>(b.pct_from_low||0)-(a.pct_from_low||0)); break;
    }
    return arr;
  }
};

// ════════════════════  Mini K-line Chart  ════════════════════
function drawChart(canvas, etf){
  var closes = etf.price_history;
  if(!closes || closes.length<10) return;

  var W=canvas.parentElement.clientWidth-32, H=80;
  canvas.width=W*devicePixelRatio; canvas.height=H*devicePixelRatio;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  var ctx=canvas.getContext('2d');
  ctx.scale(devicePixelRatio,devicePixelRatio);

  var min=Math.min.apply(null,closes), max=Math.max.apply(null,closes);
  // Include BB bands and 1Y low in the visible range
  if(etf.bb_lower && etf.bb_lower<min) min=etf.bb_lower;
  if(etf.bb_upper && etf.bb_upper>max) max=etf.bb_upper;
  if(etf.bb_lower_history){
    var bbMin=Math.min.apply(null,etf.bb_lower_history);
    if(bbMin<min) min=bbMin;
  }
  if(etf.bb_upper_history){
    var bbMax=Math.max.apply(null,etf.bb_upper_history);
    if(bbMax>max) max=bbMax;
  }
  if(etf.min_price_1y && etf.min_price_1y<min) min=etf.min_price_1y;
  var range=max-min||1, pad=range*0.05;
  min-=pad; max+=pad; range=max-min;

  var n=closes.length, stepX=W/(n-1);

  // Determine color: green if price rose, red if fell
  var first=closes[0], last=closes[closes.length-1];
  var color=last>=first?'#22c55e':'#ef4444';
  var fillColor=last>=first?'rgba(34,197,94,.12)':'rgba(239,68,68,.08)';

  // Fill area
  ctx.beginPath();
  ctx.moveTo(0,H);
  for(var i=0;i<n;i++){
    var x=i*stepX, y=H-((closes[i]-min)/range)*H;
    ctx.lineTo(x,y);
  }
  ctx.lineTo((n-1)*stepX,H);
  ctx.closePath();
  ctx.fillStyle=fillColor;
  ctx.fill();

  // Line
  ctx.beginPath();
  for(var i=0;i<n;i++){
    var x=i*stepX, y=H-((closes[i]-min)/range)*H;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.strokeStyle=color; ctx.lineWidth=1.8; ctx.stroke();

  // BB lower band curve (if full history available)
  if(etf.bb_lower_history && etf.bb_lower_history.length>1){
    var bbHist = etf.bb_lower_history;
    // Align BB curve to the right edge (last N closes)
    var bbN = Math.min(bbHist.length, n);
    var bbStepX = W/(bbN-1);
    var bbOffset = W - (bbN-1)*bbStepX; // start offset if BB is shorter than price
    ctx.beginPath();
    ctx.setLineDash([4,3]);
    for(var j=0;j<bbN;j++){
      var bx=bbOffset + j*bbStepX, by=H-((bbHist[j]-min)/range)*H;
      if(j===0) ctx.moveTo(bx,by); else ctx.lineTo(bx,by);
    }
    ctx.strokeStyle='rgba(234,179,8,.6)'; ctx.lineWidth=1.2; ctx.stroke();
    ctx.setLineDash([]);
  }else if(etf.bb_lower){
    // Fallback: single horizontal line
    var bbY=H-((etf.bb_lower-min)/range)*H;
    if(bbY>0 && bbY<H){
      ctx.beginPath();
      ctx.setLineDash([4,4]);
      ctx.moveTo(0,bbY); ctx.lineTo(W,bbY);
      ctx.strokeStyle='rgba(234,179,8,.5)'; ctx.lineWidth=1; ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // BB upper band curve
  if(etf.bb_upper_history && etf.bb_upper_history.length>1){
    var ubHist = etf.bb_upper_history;
    var ubN = Math.min(ubHist.length, n);
    var ubStepX = W/(ubN-1);
    var ubOffset = W - (ubN-1)*ubStepX;
    ctx.beginPath();
    ctx.setLineDash([4,3]);
    for(var k=0;k<ubN;k++){
      var ux=ubOffset + k*ubStepX, uy=H-((ubHist[k]-min)/range)*H;
      if(k===0) ctx.moveTo(ux,uy); else ctx.lineTo(ux,uy);
    }
    ctx.strokeStyle='rgba(234,179,8,.6)'; ctx.lineWidth=1.2; ctx.stroke();
    ctx.setLineDash([]);
  }else if(etf.bb_upper){
    var ubY=H-((etf.bb_upper-min)/range)*H;
    if(ubY>0 && ubY<H){
      ctx.beginPath();
      ctx.setLineDash([4,4]);
      ctx.moveTo(0,ubY); ctx.lineTo(W,ubY);
      ctx.strokeStyle='rgba(234,179,8,.5)'; ctx.lineWidth=1; ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // 1Y low (dashed cyan + label)
  if(etf.min_price_1y){
    var lowY=H-((etf.min_price_1y-min)/range)*H;
    if(lowY>0 && lowY<H){
      ctx.beginPath();
      ctx.setLineDash([2,6]);
      ctx.moveTo(0,lowY); ctx.lineTo(W,lowY);
      ctx.strokeStyle='rgba(6,182,212,.6)'; ctx.lineWidth=1; ctx.stroke();
      ctx.setLineDash([]);
      // Label
      ctx.fillStyle='rgba(6,182,212,.85)';
      ctx.font='9px monospace';
      ctx.fillText(etf.min_price_1y.toFixed(2), 2, lowY-3);
    }
  }
}

// ════════════════════  Render  ════════════════════
function R(){
  var q=(document.getElementById('q').value||'').toLowerCase();
  var sort=document.getElementById('sort').value;
  var arr=D._etfs.slice();
  if(q) arr=arr.filter(function(e){return e.name.toLowerCase().indexOf(q)>=0||e.code.indexOf(q)>=0});
  arr=D.sort(arr,sort);
  document.getElementById('rc').textContent=arr.length+' ETFs';
  renderGrid(arr);
  renderTable(arr);
}

function discountClass(v){return v<-0.3?'green':v>0.3?'red':'';}
function pctClass(v){if(v==null)return'';return v<=5?'lo':v<=15?'mi':'hi';}
function peClass(v){if(v==null)return'';return v<=30?'lo':v<=70?'mi':'hi';}

function renderGrid(arr){
  var h='';
  for(var i=0;i<arr.length;i++){
    var e=arr[i];
    var dClass=e.discount_rate<-0.3?'discount':e.discount_rate>0.3?'premium':'neutral';
    var dColor=e.discount_rate<-0.3?'green':e.discount_rate>0.3?'red':'';
    var pLow=pctClass(e.pct_from_low), pBB=pctClass(e.pct_from_bb_low);
    var peCl=peClass(e.pe_percentile);
    var chgCl=e.change_pct>=0?'green':'red';
    var feeStr=e.total_fee||(e.mgmt_fee||'--');

    h+='<div class="etf-card '+dClass+'" onclick="window.open(\'https://quote.eastmoney.com/etf/'+e.code+'.html\',\'_blank\')">';
    h+='<div class="card-header"><span class="card-name">'+esc(e.name)+'</span><span class="card-code">'+e.code+'</span></div>';
    h+='<div class="card-body">';
    h+='<div class="card-m"><span class="cml">最新价</span><span class="cmv">'+e.latest_price.toFixed(3)+'</span></div>';
    h+='<div class="card-m"><span class="cml">折溢价</span><span class="cmv '+dColor+'">'+(e.discount_rate>0?'+':'')+e.discount_rate.toFixed(2)+'%</span></div>';
    h+='<div class="card-m"><span class="cml">规模</span><span class="cmv">'+(e.fund_size_yi||'--')+'亿</span></div>';
    h+='<div class="card-m"><span class="cml">涨跌幅</span><span class="cmv '+chgCl+'">'+(e.change_pct>0?'+':'')+e.change_pct.toFixed(2)+'%</span></div>';
    h+='<div class="card-m"><span class="cml">费率</span><span class="cmv">'+feeStr+'</span></div>';
    h+='<div class="card-m"><span class="cml">换手率</span><span class="cmv">'+(e.turnover_rate||0).toFixed(1)+'%</span></div>';
    if(e.pe_percentile!=null){
      h+='<div class="card-m"><span class="cml">PE分位(3Y)</span><span class="cmv '+peCl+'">'+e.pe_percentile.toFixed(1)+'%</span></div>';
    }else{
      h+='<div class="card-m"><span class="cml">PE分位(3Y)</span><span class="cmv" style="color:var(--muted)">--</span></div>';
    }
    if(e.pct_from_low!=null){
      h+='<div class="card-m"><span class="cml">距1Y低点</span><span class="cmv '+pLow+'">'+e.pct_from_low.toFixed(1)+'%</span></div>';
    }else{
      h+='<div class="card-m"><span class="cml">1Y最低</span><span class="cmv">'+(e.min_price_1y||'--')+'</span></div>';
    }
    h+='</div>';
    h+='<div class="card-chart"><canvas id="cv'+i+'"></canvas></div>';
    h+='</div>';
  }
  document.getElementById('gv').innerHTML=h;

  // Draw charts after DOM update
  setTimeout(function(){
    for(var i=0;i<arr.length;i++){
      var cv=document.getElementById('cv'+i);
      if(cv) drawChart(cv,arr[i]);
    }
  },50);
}

function renderTable(arr){
  var h='';
  for(var i=0;i<arr.length;i++){
    var e=arr[i];
    var dColor=discountClass(e.discount_rate);
    var pLow=pctClass(e.pct_from_low), pBB=pctClass(e.pct_from_bb_low);
    var peCl=peClass(e.pe_percentile);
    var chgCl=e.change_pct>=0?'green':'red';
    h+='<tr onclick="window.open(\'https://quote.eastmoney.com/etf/'+e.code+'.html\',\'_blank\')">';
    h+='<td>'+(i+1)+'</td>';
    h+='<td class="t-name">'+esc(e.name)+'<span class="t-code">'+e.code+'</span></td>';
    h+='<td>'+e.latest_price.toFixed(3)+'</td>';
    h+='<td class="t-discount '+dColor+'">'+(e.discount_rate>0?'+':'')+e.discount_rate.toFixed(2)+'%</td>';
    h+='<td class="'+chgCl+'">'+(e.change_pct>0?'+':'')+e.change_pct.toFixed(2)+'%</td>';
    h+='<td>'+(e.fund_size_yi||'--')+'</td>';
    h+='<td>'+(e.total_fee||e.mgmt_fee||'--')+'</td>';
    h+='<td class="t-pe '+peCl+'">'+(e.pe_percentile!=null?e.pe_percentile.toFixed(1)+'%':'--')+'</td>';
    h+='<td class="t-pct '+pLow+'">'+(e.pct_from_low!=null?e.pct_from_low.toFixed(1)+'%':'--')+'</td>';
    h+='<td class="t-pct '+pBB+'">'+(e.pct_from_bb_low!=null?e.pct_from_bb_low.toFixed(1)+'%':'--')+'</td>';
    h+='<td>'+(e.turnover_rate||0).toFixed(1)+'%</td>';
    h+='</tr>';
  }
  document.getElementById('tb').innerHTML=h;
}

function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

// ════════════════════  View Switch  ════════════════════
var V={
  switch:function(v){
    document.getElementById('gv').classList.toggle('active',v==='grid');
    document.getElementById('tv').classList.toggle('active',v==='table');
    var btns=document.querySelectorAll('.btn-view');
    btns[0].classList.toggle('active',v==='grid');
    btns[1].classList.toggle('active',v==='table');
    if(v==='grid'){setTimeout(function(){R();},100);}
  }
};

// ════════════════════  Update / Refresh  ════════════════════
var _updating=false;
async function U(force, mode){
  if(_updating)return;
  _updating=true;
  var m = mode || 'quick';
  var isFull = m==='full';

  // Disable both buttons during refresh
  var btnQ = document.getElementById('btnQ');
  var btnF = document.getElementById('btnF');
  btnQ.disabled=true; btnF.disabled=true;

  // Highlight active button
  if(isFull){
    btnF.textContent='⏳ Full Refresh...';
    btnQ.textContent='⚡ Quick Refresh';
  }else{
    btnQ.textContent='⏳ Quick Refresh...';
    btnF.textContent='🔄 Full Refresh';
  }

  try{
    if(force){
      document.getElementById('metaSource').textContent='Refreshing...';
      document.getElementById('metaMode').textContent='Mode: '+(isFull?'Full (fetching)':'Quick (fetching)');
      try{
        var base=D._detectApi();
        // Trigger async server refresh with mode
        var refreshUrl = base+'/api/refresh?async=1'+(isFull?'':'&quick=1');
        await fetch(refreshUrl,{signal:AbortSignal.timeout(5000)});
      }catch(e){}

      // Poll for fresh data
      var maxPolls = isFull ? 45 : 8;  // Full: ~135s, Quick: ~24s
      var pollInterval = isFull ? 3000 : 3000;
      for(var i=0;i<maxPolls;i++){
        await new Promise(function(r){setTimeout(r,pollInterval);});
        try{
          var pollUrl = base+'/api/etf_data'+(isFull?'?full=1':'');
          var r2=await fetch(pollUrl,{signal:AbortSignal.timeout(15000)});
          var j2=await r2.json();
          if(j2.etfs && j2.etfs.length>0){
            D._etfs=j2.etfs; D._loaded=true;
            D._mode = j2.mode || m;
            document.getElementById('metaSource').textContent='API (live)';
            document.getElementById('metaTime').textContent='Updated: '+(j2.updated||'--');
            document.getElementById('metaMode').textContent='Mode: '+(D._mode==='full'?'Full':'Quick');
            document.getElementById('gv').classList.add('active');
            document.getElementById('empty').style.display='none';
            D._updateMeta(); R();
            break;
          }
        }catch(e){}
        var elapsed = (i+1)*pollInterval/1000;
        if(isFull){
          btnF.textContent='⏳ Full ('+elapsed+'s)...';
        }else{
          btnQ.textContent='⏳ Quick ('+elapsed+'s)...';
        }
      }
    }else{
      await D.load(false, m);
    }
    if(D._loaded){
      toast('✅ Loaded '+D._etfs.length+' ETFs ('+(D._mode==='full'?'Full':'Quick')+')','ok');
    }
  }catch(e){
    toast('❌ Refresh failed: '+e.message,'err');
  }
  _updating=false;
  btnQ.disabled=false; btnF.disabled=false;
  if(isFull){
    btnF.textContent='🔄 Full Refresh';
  }else{
    btnQ.textContent='⚡ Quick Refresh';
  }
}

// ════════════════════  Toast  ════════════════════
function toast(msg,type){
  var t=document.getElementById('toast');
  t.textContent=msg; t.className='toast '+type+' show';
  clearTimeout(t._tid);
  t._tid=setTimeout(function(){t.classList.remove('show')},3000);
}

// ════════════════════  Init  ════════════════════
(function init(){
  D.load(false, 'quick');
  var base = D._detectApi();
  console.log('ETF Screener ready, API:',base);
})();
</script>
